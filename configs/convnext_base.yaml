# YOLOv11-ConvNeXt Base Model Configuration

model:
  type: yolov11-convnext
  size: base
  
  backbone:
    type: convnext_base
    depths: [3, 3, 27, 3]
    dims: [128, 256, 512, 1024]
    drop_path_rate: 0.3
    
  head:
    num_classes: 80
    anchors: 3
    
  neck:
    type: pafpn
    channels: [128, 256, 512, 1024]
    
training:
  batch_size: 8
  epochs: 300
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.05
  warmup_epochs: 3
  
augmentation:
  mosaic: 1.0
  mixup: 0.2
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  
data:
  img_size: 640
  cache_images: false
  workers: 8
